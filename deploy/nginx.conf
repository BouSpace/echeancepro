# /etc/nginx/sites-available/echeancepro
# Remplacez DOMAINE par votre nom de domaine. Certbot ajoutera ensuite le bloc HTTPS tout seul.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;

    client_max_body_size 15m;   # pièces jointes et imports Excel

    # Fichiers téléversés : Django vérifie la connexion, puis Nginx envoie le fichier (X-Accel-Redirect)
    location /protected-media/ {
        internal;
        alias /srv/echeancepro/media/;
    }

    location / {
        proxy_pass http://unix:/run/echeancepro/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
